services:
  banco:
    image: postgres:18
    environment:
      POSTGRES_DB: prazo
      POSTGRES_USER: prazo
      POSTGRES_PASSWORD: ${PRAZO_DB_PASSWORD:?Defina PRAZO_DB_PASSWORD no ambiente}
    ports: ["127.0.0.1:5432:5432"]
    volumes:
      - dados_prazo:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U prazo -d prazo"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  dados_prazo: